services:
  gateway:
    build:
      context: ../gateway
    ports:
      - "8080:8080"
    networks:
      - validator-net
    depends_on:
      - service-cpf
      - service-cnpj
      - service-cep
      - service-email
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  service-cpf:
    build:
      context: ../service-cpf
    networks:
      - validator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  service-cnpj:
    build:
      context: ../service-cnpj
    networks:
      - validator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  service-cep:
    build:
      context: ../service-cep
    networks:
      - validator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  service-email:
    build:
      context: ../service-email
    networks:
      - validator-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  validator-net:
    driver: bridge
